<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workouts Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        nav {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        nav a {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        nav a:hover {
            background: #764ba2;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        button {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        button.delete {
            background: #f93e3e;
        }

        button.delete:hover {
            background: #d32f2f;
        }

        button.edit {
            background: #fca130;
        }

        button.edit:hover {
            background: #f57c00;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f8f9fa;
            color: #667eea;
            font-weight: bold;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Workout Tracker - Workouts Manager</h1>
            <p>Beheer je workouts</p>
            <nav>
                <a href="/workouts.html">Workouts</a>
                <a href="/exercises.html">Exercises</a>
                <a href="/statistics.html">Statistics</a>
                <a href="/">API Documentatie</a>
            </nav>
        </header>

        <!-- Message Area -->
        <div id="message" class="hidden"></div>

        <!-- Add/Edit Form -->
        <div class="section">
            <h2 id="formTitle">Nieuwe Workout Toevoegen</h2>
            <form id="workoutForm">
                <input type="hidden" id="workoutId">

                <div class="form-group">
                    <label for="name">Naam *</label>
                    <input type="text" id="name" required placeholder="bijv. Morning Cardio">
                </div>

                <div class="form-group">
                    <label for="date">Datum *</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label for="duration">Duur (minuten) *</label>
                    <input type="number" id="duration" required min="1" placeholder="bijv. 30">
                </div>

                <div class="form-group">
                    <label for="type">Type *</label>
                    <select id="type" required>
                        <option value="">Selecteer type...</option>
                        <option value="cardio">Cardio</option>
                        <option value="strength">Strength</option>
                        <option value="flexibility">Flexibility</option>
                        <option value="sports">Sports</option>
                        <option value="mixed">Mixed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="notes">Notities - Optioneel</label>
                    <textarea id="notes" rows="3" placeholder="bijv. Voelde me goed vandaag, nieuwe PR!"></textarea>
                </div>

                <button type="submit" id="submitBtn">Toevoegen</button>
                <button type="button" onclick="resetForm()" style="background: #6c757d;">Annuleren</button>
            </form>
        </div>

        <!-- Workouts List -->
        <div class="section">
            <h2>Alle Workouts</h2>
            <div id="loading" class="loading hidden">Laden...</div>
            <div id="workoutsList"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/workouts';
        let editingId = null;

        // Load workouts on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadWorkouts();
            setDefaultDate();
        });

        // Set today's date as default
        function setDefaultDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = today;
        }

        // Show message
        function showMessage(text, type = 'success') {
            const messageEl = document.getElementById('message');
            messageEl.className = `message ${type}`;
            messageEl.textContent = text;
            messageEl.classList.remove('hidden');

            setTimeout(() => {
                messageEl.classList.add('hidden');
            }, 5000);
        }

        // Load all workouts
        async function loadWorkouts() {
            const loadingEl = document.getElementById('loading');
            const listEl = document.getElementById('workoutsList');

            loadingEl.classList.remove('hidden');

            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                if (data.success) {
                    displayWorkouts(data.data);
                } else {
                    showMessage('Error bij het laden van workouts', 'error');
                }
            } catch (error) {
                showMessage('Kan geen verbinding maken met de server', 'error');
                console.error('Error:', error);
            } finally {
                loadingEl.classList.add('hidden');
            }
        }

        // Display workouts in table
        function displayWorkouts(workouts) {
            const listEl = document.getElementById('workoutsList');

            if (workouts.length === 0) {
                listEl.innerHTML = '<p>Geen workouts gevonden. Voeg je eerste workout toe!</p>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Naam</th>
                            <th>Datum</th>
                            <th>Duur (min)</th>
                            <th>Type</th>
                            <th>Acties</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            workouts.forEach(workout => {
                const date = new Date(workout.date).toLocaleDateString('nl-NL');
                html += `
                    <tr>
                        <td>${workout.id}</td>
                        <td>${workout.name}</td>
                        <td>${date}</td>
                        <td>${workout.duration}</td>
                        <td>${workout.type}</td>
                        <td>
                            <div class="actions">
                                <button class="edit" onclick="editWorkout(${workout.id})">Bewerken</button>
                                <button class="delete" onclick="deleteWorkout(${workout.id}, '${workout.name}')">Verwijderen</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            listEl.innerHTML = html;
        }

        // Handle form submission
        document.getElementById('workoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('workoutId').value;
            const workout = {
                name: document.getElementById('name').value,
                date: document.getElementById('date').value,
                duration: parseInt(document.getElementById('duration').value),
                type: document.getElementById('type').value,
                notes: document.getElementById('notes').value || null
            };

            try {
                let response;
                if (id) {
                    // Update
                    response = await fetch(`${API_URL}/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(workout)
                    });
                } else {
                    // Create
                    response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(workout)
                    });
                }

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message);
                    resetForm();
                    loadWorkouts();
                } else {
                    showMessage(data.message || 'Er is een fout opgetreden', 'error');
                }
            } catch (error) {
                showMessage('Kan geen verbinding maken met de server', 'error');
                console.error('Error:', error);
            }
        });

        // Edit workout
        async function editWorkout(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                const data = await response.json();

                if (data.success) {
                    const workout = data.data;
                    document.getElementById('workoutId').value = workout.id;
                    document.getElementById('name').value = workout.name;
                    document.getElementById('date').value = workout.date.split('T')[0];
                    document.getElementById('duration').value = workout.duration;
                    document.getElementById('type').value = workout.type;
                    document.getElementById('notes').value = workout.notes || '';

                    document.getElementById('formTitle').textContent = 'Workout Bewerken';
                    document.getElementById('submitBtn').textContent = 'Bijwerken';

                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    showMessage('Workout niet gevonden', 'error');
                }
            } catch (error) {
                showMessage('Kan workout niet laden', 'error');
                console.error('Error:', error);
            }
        }

        // Delete workout
        async function deleteWorkout(id, name) {
            if (!confirm(`Weet je zeker dat je "${name}" wilt verwijderen?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message);
                    loadWorkouts();
                } else {
                    showMessage(data.message || 'Kan workout niet verwijderen', 'error');
                }
            } catch (error) {
                showMessage('Kan geen verbinding maken met de server', 'error');
                console.error('Error:', error);
            }
        }

        // Reset form
        function resetForm() {
            document.getElementById('workoutForm').reset();
            document.getElementById('workoutId').value = '';
            document.getElementById('formTitle').textContent = 'Nieuwe Workout Toevoegen';
            document.getElementById('submitBtn').textContent = 'Toevoegen';
            setDefaultDate();
        }
    </script>
</body>
</html>
